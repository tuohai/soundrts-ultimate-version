name: Attach artifacts to release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID with artifacts"
        required: true
        type: string
      release_tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts from another run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: "SoundRTS-1.5.0.7-*"
          merge-multiple: false

      - name: Upload to release
        run: |
          echo "Uploading artifacts..."
          FILES=$(find . -type f \( -name "SoundRTS-1.5.0.7-*.zip" -o -name "SoundRTS-1.5.0.7-*.tar.gz" \))
          echo "Files found:"
          echo "$FILES"
          for f in $FILES; do
            echo "Uploading: $f"
          done
          gh release upload "${{ inputs.release_tag }}" $FILES --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}